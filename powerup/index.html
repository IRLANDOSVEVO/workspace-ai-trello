<!DOCTYPE html>\n<html lang=\"it\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Workspace AI - Trello Power-Up</title>\n  <script src=\"https://p.trellocdn.com/power-up/power-up.min.js\"></script>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; background: #f5f7fa; color: #1a1a1a; }\n    .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 32px; padding: 24px; }\n    .header { text-align: center; }\n    .logo { font-size: 48px; margin-bottom: 16px; }\n    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }\n    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }\n    .button { padding: 12px 28px; background: #0052cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0, 82, 204, 0.15); }\n    .button:hover { background: #0043a8; box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25); transform: translateY(-1px); }\n    .button:active { transform: translateY(0); box-shadow: 0 2px 4px rgba(0, 82, 204, 0.2); }\n    .button.loading { opacity: 0.7; cursor: not-allowed; }\n    .button.loading::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }\n    @keyframes spin { to { transform: rotate(360deg); } }\n    .status { font-size: 12px; color: #999; text-align: center; min-height: 20px; }\n    .error { color: #d32f2f; padding: 12px 16px; background: #ffebee; border-radius: 6px; font-size: 14px; }\n  </style>\n</head>\n<body>\n  <div class=\"container\">\n    <div class=\"header\">\n      <div class=\"logo\">🤖</div>\n      <h1>Workspace AI</h1>\n      <p class=\"subtitle\">Analizza la bacheca Trello con IA</p>\n    </div>\n    <button id=\"exportBtn\" class=\"button\">Apri in Workspace AI</button>\n    <div class=\"status\" id=\"status\"></div>\n    <div id=\"error\"></div>\n  </div>\n  <script src=\"./client.js\"></script>\n</body>\n</html>\n
