<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace AI - Trello Power-Up</title>
  <script src="https://p.trellocdn.com/power-up/power-up.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; background: #f5f7fa; color: #1a1a1a; }
    .container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 32px; padding: 24px; }
    .header { text-align: center; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
    .button { padding: 12px 28px; background: #0052cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 2px 8px rgba(0, 82, 204, 0.15); }
    .button:hover { background: #0043a8; box-shadow: 0 4px 12px rgba(0, 82, 204, 0.25); transform: translateY(-1px); }
    .button:active { transform: translateY(0); box-shadow: 0 2px 4px rgba(0, 82, 204, 0.2); }
    .button.loading { opacity: 0.7; cursor: not-allowed; }
    .button.loading::after { content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 8px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 12px; color: #999; text-align: center; min-height: 20px; }
    .error { color: #d32f2f; padding: 12px 16px; background: #ffebee; border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🤖</div>
      <h1>Workspace AI</h1>
      <p class="subtitle">Analizza la bacheca Trello con IA</p>
    </div>
    <button id="exportBtn" class="button">Apri in Workspace AI</button>
    <div class="status" id="status"></div>
    <div id="error"></div>
  </div>
  <script src="./client.js"></script>
</body>
</html>
